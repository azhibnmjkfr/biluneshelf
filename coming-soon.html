<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Coming Soon — BiluneShelf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
            background-image: radial-gradient(circle at 50% 0%, rgba(226, 184, 116, 0.05) 0%, transparent 70%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f3f4f6;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        /* Brand */
        .brand {
            margin-bottom: 32px;
        }

        .brand-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
        }

        .brand-name {
            font-family: 'Georgia', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 25%, #e2b874 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Card */
        .card {
            background: rgba(18, 22, 31, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 40px 28px 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(226, 184, 116, 0.12);
            color: #e2b874;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            border: 1px solid rgba(226, 184, 116, 0.15);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: 'Georgia', serif;
            color: #ffffff;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Animasi Rotasi Loop */
        .spinner-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin: 6px 0 4px 0;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(226, 184, 116, 0.15);
            border-top: 2px solid #e2b874;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            font-size: 13px;
            color: #9ca3af;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        /* Tombol Kembali */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #f3f4f6;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(226, 184, 116, 0.08);
            border-color: rgba(226, 184, 116, 0.2);
            transform: translateY(-2px);
        }

        .btn-back:active {
            transform: scale(0.97);
        }

        .footer {
            font-size: 10px;
            color: #9ca3af;
            opacity: 0.25;
            letter-spacing: 1.5px;
            margin-top: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 24px;
            }
            h1 {
                font-size: 20px;
            }
            .brand-name {
                font-size: 20px;
            }
            .brand-icon {
                font-size: 36px;
            }
            .spinner {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Brand -->
        <div class="brand">
            <span class="brand-icon">📚</span>
            <span class="brand-name">BiluneShelf</span>
        </div>

        <!-- Card -->
        <div class="card">
            <div class="badge">✦ Segera Hadir</div>

            <h1>Karya Sedang Ditunggu</h1>
            <p class="subtitle">
                Buku ini masih dalam proses penulisan.<br />
                Terima kasih masih menunggu.
            </p>

            <!-- Spinner Loop -->
            <div class="spinner-wrapper">
                <div class="spinner"></div>
                <span class="spinner-text">Coming Soon</span>
            </div>
        </div>

        <!-- Tombol Kembali -->
        <a href="https://azhibnmjkfr.github.io/biluneshelf/" class="btn-back">
            <span>←</span> Kembali ke Rak Buku
        </a>

        <div class="footer">
            BiluneShelf · Personal Digital Library
        </div>
    </div>

</body>
</html>
